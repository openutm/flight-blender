<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flight Blender - UTM API Server">
  <meta name="theme-color" content="#0d9488">
  <title>Flight Blender</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --ink: #0f172a;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --panel: #ffffff;
      --panel-2: #f1f5f9;
      --line: #e2e8f0;
      --cyan: #0d9488;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --shadow: 0 4px 24px rgba(15,23,42,.08);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #07101d;
      --ink: #f5f7fa;
      --muted: #8b98aa;
      --muted-2: #5d6b7e;
      --panel: #0c1726;
      --panel-2: #101d2d;
      --line: #1b2a3c;
      --cyan: #4ee8c8;
      --blue: #65a8ff;
      --green: #4ade80;
      --red: #f87171;
      --shadow: 0 18px 60px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); transition: background .3s ease; }
    body { margin: 0; min-height: 100vh; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 40px 20px; transition: color .3s ease; }
    .card { width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 48px 40px; text-align: center; position: relative; transition: background .3s ease, border-color .3s ease, box-shadow .3s ease; }
    .theme-toggle { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); cursor: pointer; color: var(--muted); transition: .15s ease; }
    .theme-toggle:hover { background: var(--bg); border-color: var(--cyan); color: var(--cyan); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .sun-icon { display: none; }
    [data-theme="dark"] .theme-toggle .sun-icon { display: block; }
    [data-theme="dark"] .theme-toggle .moon-icon { display: none; }
    .logo { width: 240px; height: 240px; margin: 0 auto 16px; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(13,148,136,.15); }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 { margin: 0 0 12px; font-size: 28px; font-weight: 700; letter-spacing: -.03em; }
    .tagline { color: var(--muted); font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
    .links { display: grid; gap: 8px; text-align: left; }
    .link { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; transition: .15s ease; }
    .link:hover { background: var(--bg); border-color: var(--cyan); color: var(--cyan); }
    .link .status-indicator { display: inline-flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted-2); transition: background .2s ease; }
    .status-dot.checking { animation: pulse 1.5s infinite; }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .link svg { width: 18px; height: 18px; flex-shrink: 0; margin-left: 12px; color: var(--muted-2); transition: color .15s ease; }
    .link:hover svg { color: var(--cyan); }
    footer { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted-2); font-size: 13px; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--cyan); text-decoration: underline; }
    @media (max-width: 520px) { .card { padding: 32px 24px; } h1 { font-size: 24px; } .logo { width: 100px; height: 100px; } }
  </style>
</head>
<body>
  <main class="card" role="main">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
      <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <div class="logo"><img src="/images/blender-logo.jpg" alt="Flight Blender Logo"></div>
    <h1>Flight Blender</h1>
    <p class="tagline">Congratulations! Your instance of Flight Blender is working!</p>
    <nav class="links" aria-label="Quick links">
      <a class="link" href="/ping">
        <span>Check Ping Status</span>
        <span class="status-indicator"><span id="pingDot" class="status-dot checking" aria-hidden="true"></span><span id="pingText" aria-live="polite">Checking…</span></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </a>
      <a class="link" href="/redoc">
        <span>API Reference (ReDoc)</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </a>
    </nav>
    <footer>© OpenUTM Ltd. · <a href="https://github.com/openutm" target="_blank" rel="noopener">GitHub</a></footer>
  </main>
  <script>
    (() => {
      const html = document.documentElement;
      const toggle = document.getElementById('themeToggle');
      const dot = document.getElementById('pingDot');
      const text = document.getElementById('pingText');

      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
      }

      function initTheme() {
        const saved = localStorage.getItem('theme');
        if (saved) {
          applyTheme(saved);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          applyTheme('dark');
        }
      }

      toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      async function checkPing() {
        try {
          const response = await fetch('/ping', { cache: 'no-store', method: 'GET' });
          if (response.ok) {
            dot.className = 'status-dot online';
            text.textContent = 'Online';
          } else {
            dot.className = 'status-dot offline';
            text.textContent = 'Offline';
          }
        } catch {
          dot.className = 'status-dot offline';
          text.textContent = 'Unreachable';
        }
      }

      initTheme();
      checkPing();
      setInterval(checkPing, 30000);
    })();
  </script>
</body>
</html>
